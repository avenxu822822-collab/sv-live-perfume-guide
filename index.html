<html lang="zh-CN">
<head>

<title>SV 香水直播搜索器</title>
<style>
:root {
  --paper: #f6f0eb; --surface: #fffdfb; --ink: #241d1b; --muted: #786b65;
  --line: #ddcec7; --wine: #7b2035; --wine-soft: #f0dde1; --gold: #a87943;
  --shadow: 0 12px 35px rgba(61, 31, 28, .09); --body-size: 16px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; color: var(--ink); background:
  radial-gradient(circle at 0 0, rgba(173, 112, 101, .12), transparent 30rem), var(--paper);
  font-family: "Songti SC", "STSong", "Hiragino Sans GB", sans-serif; font-size: var(--body-size); }
body.large { --body-size: 20px; }
body.locked { overflow: hidden; }
button, input { font: inherit; }
.gate { position:fixed; z-index:1000; inset:0; display:grid; place-items:center; padding:22px;
  background:radial-gradient(circle at 50% 18%, rgba(173,112,101,.2), transparent 28rem), #f6f0eb; }
.gate[hidden] { display:none; }
.gate-card { width:min(410px,100%); padding:30px 24px; border:1px solid var(--line); border-radius:20px;
  background:rgba(255,253,251,.98); box-shadow:var(--shadow); text-align:center; }
.gate-mark { width:68px; height:68px; display:grid; place-items:center; margin:0 auto 16px; border-radius:50%;
  background:var(--wine); color:#fff; font-family:"Kaiti SC","STKaiti",serif; font-size:26px; letter-spacing:.04em; }
.gate h2 { margin:0; color:var(--wine); font-family:"Kaiti SC","STKaiti",serif; font-size:28px; }
.gate p { margin:9px 0 20px; color:var(--muted); line-height:1.6; }
.gate-form { display:grid; gap:10px; }
.gate input { width:100%; height:52px; padding:0 15px; border:1.5px solid var(--line); border-radius:11px;
  background:#fff; color:var(--ink); outline:none; text-align:center; letter-spacing:.04em; }
.gate input:focus { border-color:var(--wine); box-shadow:0 0 0 4px rgba(123,32,53,.1); }
.gate button { height:50px; border:0; border-radius:11px; background:var(--wine); color:#fff; font-weight:700; }
.gate-error { min-height:1.4em; margin:2px 0 0 !important; color:#a12532 !important; font-size:.9em; }
.shell { max-width: 920px; margin: 0 auto; padding: 0 18px 100px; }
.top { position: sticky; top: 0; z-index: 20; margin: 0 -18px; padding: calc(12px + env(safe-area-inset-top)) 18px 12px;
  background: rgba(246,240,235,.94); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(123,32,53,.12); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
h1 { margin: 0; color: var(--wine); font-family: "Kaiti SC", "STKaiti", serif; font-size: clamp(24px, 5vw, 34px); font-weight: 700; letter-spacing: .02em; }
.count { color: var(--muted); font-size: .78em; white-space: nowrap; }
.search-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.search-wrap { position: relative; }
#search { width: 100%; height: 54px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 50px 0 17px;
  background: var(--surface); color: var(--ink); outline: none; box-shadow: 0 4px 18px rgba(72,38,33,.06); }
#search:focus { border-color: var(--wine); box-shadow: 0 0 0 4px rgba(123,32,53,.1); }
.clear { position: absolute; right: 8px; top: 7px; width: 40px; height: 40px; border: 0; background: transparent; color: var(--muted); border-radius: 10px; }
.utility { height: 54px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--wine); white-space: nowrap; }
.tips { margin: 10px 2px 0; color: var(--muted); font-size: .78em; line-height: 1.5; }
.quick { display: flex; gap: 8px; overflow-x: auto; padding: 18px 0 6px; scrollbar-width: none; }
.quick::-webkit-scrollbar { display:none; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 999px; padding: 9px 13px; color: var(--ink); background: rgba(255,253,251,.78); }
.chip.active { color: #fff; background: var(--wine); border-color: var(--wine); }
.section-title { display: flex; align-items: center; gap: 12px; margin: 22px 0 12px; color: var(--wine); font-size: 1.05em; }
.section-title::after { content:""; height: 1px; flex: 1; background: var(--line); }
.list { display: grid; gap: 11px; }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
  box-shadow: 0 4px 18px rgba(61,31,28,.04); animation: rise .24s ease both; }
.card.featured { border-color: rgba(123,32,53,.35); box-shadow: var(--shadow); }
@keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.card-head { display:flex; align-items:flex-start; justify-content:space-between; gap: 12px; margin-bottom: 9px; }
.name { font-family: "Kaiti SC", "STKaiti", serif; font-size: 1.35em; line-height: 1.15; font-weight: 700; }
.meta { margin-top: 5px; color: var(--muted); font-size: .78em; }
.price { color: var(--wine); font-size: .8em; white-space: nowrap; }
.line { margin: 7px 0; line-height: 1.65; }
.label { color: var(--wine); font-weight: 700; }
.notes { display:grid; grid-template-columns:1fr; gap:6px; margin:10px 0; padding:11px 12px; border-radius:10px; background:#f8f1ed; }
.note { line-height:1.5; }
.story { margin:10px 0 7px; padding:11px 12px; border-left:3px solid var(--gold); background:#fff8ed; line-height:1.65; }
.actions { display:flex; gap:8px; margin-top: 12px; }
.copy { flex:1; min-height: 43px; border-radius: 10px; border: 1px solid var(--wine); background: var(--wine); color:white; }
.copy.secondary { flex:0 0 auto; padding: 0 14px; background:transparent; color:var(--wine); }
.copy.done { background:#315b49; border-color:#315b49; color:white; }
.empty { padding: 60px 20px; text-align:center; color:var(--muted); line-height:1.8; }
.bottom-tools { position: fixed; z-index: 30; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  display:flex; gap:8px; padding:7px; border:1px solid rgba(123,32,53,.18); border-radius:14px;
  background:rgba(255,253,251,.94); backdrop-filter:blur(15px); box-shadow:var(--shadow); }
.bottom-tools button { border:0; border-radius:9px; padding:10px 13px; color:var(--ink); background:transparent; white-space:nowrap; }
.bottom-tools button.on { color:white; background:var(--wine); }
.toast { position: fixed; z-index: 50; left:50%; bottom:90px; transform:translate(-50%, 20px); opacity:0;
  background:var(--ink); color:white; border-radius:10px; padding:11px 16px; pointer-events:none; transition:.2s; }
.toast.show { opacity:1; transform:translate(-50%,0); }
mark { color:inherit; background:#f4d7a5; border-radius:3px; padding:0 1px; }
@media (min-width: 760px) {
  .shell { padding-left: 28px; padding-right: 28px; }
  .top { margin: 0 -28px; padding-left:28px; padding-right:28px; }
  .list { grid-template-columns: repeat(2,minmax(0,1fr)); align-items:start; }
  .card { min-height: 260px; display:flex; flex-direction:column; }
  .notes { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .actions { margin-top:auto; padding-top:8px; }
}
@media (prefers-reduced-motion: reduce) { * { animation:none !important; scroll-behavior:auto !important; } }
</style>
</head>

      <input id="gatePassword" type="password" autocomplete="current-password" placeholder="输入密码" aria-label="访问密码" autofocus>
      <button type="submit">进入香水库</button>
      <p class="gate-error" id="gateError" role="alert"></p>
    </form>
  </div>
</section>
<main class="shell">
  <header class="top">
    <div class="brand"><h1>SV 香水速查</h1><div class="count" id="count">80款</div></div>

      <div class="search-wrap">
        <input id="search" type="search" inputmode="search" autocomplete="off" enterkeyhint="search" autofocus

        <button class="clear" id="clear" aria-label="清空搜索">×</button>
      </div>
      <button class="utility" id="wake">保持亮屏</button>

  <section class="list" id="list" aria-live="polite"></section>
</main>

const gate = document.querySelector('#gate');
const gateForm = document.querySelector('#gateForm');
const gatePassword = document.querySelector('#gatePassword');
const gateError = document.querySelector('#gateError');
let perfumes = [];
function fromBase64(value) {
  return Uint8Array.from(atob(value), char => char.charCodeAt(0));
}
async function decryptData(password) {
  const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:fromBase64(ENCRYPTED_DATA.salt), iterations:ENCRYPTED_DATA.iterations, hash:'SHA-256'},
    material,
    {name:'AES-GCM', length:256},
    false,
    ['decrypt']
  );
  const plain = await crypto.subtle.decrypt(
    {name:'AES-GCM', iv:fromBase64(ENCRYPTED_DATA.iv)},
    key,
    fromBase64(ENCRYPTED_DATA.cipher)
  );
  return JSON.parse(new TextDecoder().decode(plain));
}
async function unlock(password) {
  perfumes = await decryptData(password);
  perfumes.forEach(p => p._hay = haystack(p));
  sessionStorage.setItem('sv-key-v2', password);
  gate.hidden = true;
  document.body.classList.remove('locked');
  render();
  setTimeout(()=>document.querySelector('#search')?.focus(),50);
}
gateForm.addEventListener('submit', async event => {
  event.preventDefault();
  gateError.textContent = '';
  try { await unlock(gatePassword.value); }
  catch { gateError.textContent='密码不正确，请重新输入'; gatePassword.select(); }
});

const $ = s => document.querySelector(s);
const list = $('#list'), input = $('#search'), count = $('#count'), title = $('#sectionTitle');
const normalize = s => (s || '').toLowerCase().replace(/[\s\-_—·|｜/\\.,，。；;:：'"“”‘’()（）]+/g, '');
let activeFamily = '全部';
let wakeLock = null;

function haystack(item) {
  return normalize([item.name,item.sourceName,item.english,item.prototype,item.family,item.notes,item.scent,item.mood,...item.aliases].join(' '));
}
const families = ['全部','今晚主推','花香','木质','柑橘','清新','东方','果香'];
$('#quick').innerHTML = families.map((x,i)=>`<button class="chip ${i===1?'active':''}" data-family="${x}">${x}</button>`).join('');
activeFamily = '今晚主推';

function familyMatch(item, family) {
  if (family === '全部') return true;
  if (family === '今晚主推') return item.featured > 0;
  if (family === '清新') return /水生|绿叶|芳香|馥奇/.test(item.family + item.notes);
  return (item.family + item.notes).includes(family);
}

function esc(s) { return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function card(item) {
  const meta = [item.family, item.english].filter(Boolean).join(' · ');
  return `<article class="card ${item.featured?'featured':''}" data-id="${item.id}">
    <div class="card-head"><div><div class="name">${esc(item.name)}</div><div class="meta">${esc(meta)}</div></div>${item.price?`<div class="price">${esc(item.price)}</div>`:''}</div>
    <p class="line"><span class="label">香调类型</span>　${esc(item.family)}</p>
    <div class="notes"><div class="note"><span class="label">前调</span>　${esc(item.top)}</div><div class="note"><span class="label">中调</span>　${esc(item.middle)}</div><div class="note"><span class="label">后调</span>　${esc(item.base)}</div></div>
    <div class="story"><span class="label">故事提示</span>　${esc(item.story)}</div>
    <p class="line"><span class="label">氛围·场景·人群</span>　${esc(item.mood.replace('氛围：',''))}</p>
    <div class="actions"><button class="copy" data-copy="public">复制公屏短句</button><button class="copy secondary" data-copy="full">复制完整</button></div>
  </article>`;
}

function render() {
  const q = normalize(input.value);
  let found = perfumes.filter(p => (!q || p._hay.includes(q)) && familyMatch(p, activeFamily));
  if (!q && activeFamily === '今晚主推') found.sort((a,b)=>a.featured-b.featured);
  if (q && !found.length && activeFamily !== '全部') {
    found = perfumes.filter(p => p._hay.includes(q));
  }
  title.textContent = q ? `搜索“${input.value.trim()}”` : activeFamily;
  count.textContent = `${found.length} / ${perfumes.length}款`;
  list.innerHTML = found.length ? found.map(card).join('') : `<div class="empty">没有找到。可以少打几个字，或搜索香材，例如“玫瑰”“柚子”。</div>`;
}

async function copyText(text, button) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  button.classList.add('done'); button.textContent='已复制';
  $('#toast').classList.add('show'); setTimeout(()=>$('#toast').classList.remove('show'),1100);
  setTimeout(()=>{ button.classList.remove('done'); button.textContent=button.dataset.copy==='public'?'复制公屏短句':'复制完整'; },1300);
}

input.addEventListener('input', ()=>{ if(input.value){activeFamily='全部'; document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.family==='全部'));} render(); window.scrollTo({top:0}); });
$('#clear').addEventListener('click', ()=>{input.value=''; activeFamily='今晚主推'; document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.family==='今晚主推')); render(); input.focus();});
$('#quick').addEventListener('click', e=>{const b=e.target.closest('.chip'); if(!b)return; activeFamily=b.dataset.family; input.value=''; document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b)); render();});
list.addEventListener('click', e=>{const b=e.target.closest('[data-copy]'); if(!b)return; const item=perfumes.find(x=>x.id===Number(b.closest('.card').dataset.id)); const full=`${item.name}\n香调类型：${item.family}\n前调：${item.top}\n中调：${item.middle}\n后调：${item.base}\n故事提示：${item.story}\n${item.mood}`; copyText(b.dataset.copy==='public'?item.public:full, b);});
$('#fontToggle').addEventListener('click', e=>{document.body.classList.toggle('large'); e.target.classList.toggle('on'); e.target.textContent=document.body.classList.contains('large')?'标准字号':'大字模式'; localStorage.setItem('sv-large',document.body.classList.contains('large')?'1':'0');});
$('#topButton').addEventListener('click', ()=>{window.scrollTo({top:0}); input.focus();});
$('#wake').addEventListener('click', async e=>{try{if(!('wakeLock' in navigator)) throw 0; wakeLock=await navigator.wakeLock.request('screen'); e.target.textContent='已保持亮屏'; e.target.classList.add('on'); wakeLock.addEventListener('release',()=>{e.target.textContent='保持亮屏';e.target.classList.remove('on');});}catch{e.target.textContent='请关闭自动锁屏';}});
document.addEventListener('visibilitychange', async()=>{if(wakeLock && document.visibilityState==='visible'){try{wakeLock=await navigator.wakeLock.request('screen');}catch{}}});
document.addEventListener('keydown', e=>{if(e.key==='/' && document.activeElement!==input){e.preventDefault();input.focus();} if(e.key==='Escape')$('#clear').click();});
if(localStorage.getItem('sv-large')==='1'){document.body.classList.add('large');$('#fontToggle').classList.add('on');$('#fontToggle').textContent='标准字号';}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js?v=live5', { updateViaCache: 'none' }).catch(() => {}));
}
const savedPassword = sessionStorage.getItem('sv-key-v2');
if (savedPassword) unlock(savedPassword).catch(()=>sessionStorage.removeItem('sv-key-v2'));
</script>
</body>
